# Install once per clone:  pip install pre-commit && pre-commit install
# Runs automatically on `git commit`; run on demand with `pre-commit run --all-files`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        # docs/*.pdf are intentional, bounded deliverables (see docs/), not
        # accidental binary commits — this just guards against the latter.
        args: ["--maxkb=3000"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
