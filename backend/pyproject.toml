[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042: str+Enum → enum.StrEnum is a deliberate follow-up change to the
# domain models, not something to churn in via a lint autofix.
ignore = ["UP042"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query()/... as an argument default is the framework's
# intended pattern, not the mutable-default-argument bug B008 looks for.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Header"]

[tool.pytest.ini_options]
testpaths = ["tests"]
