# Alembic config. See migrations/README for how this project runs
# migrations (Docker entrypoint, CI, and a pytest fixture all call the same
# `alembic upgrade head`).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# No sqlalchemy.url here on purpose — migrations/env.py builds the engine
# from app.core.database.engine (the same DATABASE_URL resolution the app
# itself uses), so there's exactly one place that decides which DB to talk
# to, not a copy here that can drift out of sync with .env.

[post_write_hooks]
hooks = ruff-fix, ruff-format
ruff-fix.type = module
ruff-fix.module = ruff
ruff-fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff-format.type = module
ruff-format.module = ruff
ruff-format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
