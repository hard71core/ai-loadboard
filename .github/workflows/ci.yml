name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR instead of queuing them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint + tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: loadboard
          POSTGRES_PASSWORD: loadboard
          POSTGRES_DB: loadboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loadboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Test-only credentials for the ephemeral CI database — not real secrets.
      DATABASE_URL: postgresql://loadboard:loadboard@localhost:5432/loadboard
      JWT_SECRET: ci-test-secret-not-for-real-use
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend · lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type-check + build
        run: npm run build
