# All actual values live in .env (gitignored). Copy .env.example → .env
# before running this. Compose loads .env from this same directory
# automatically for ${VAR} substitution below.

# Shared log rotation so a long-running --reload backend or a chatty Vite
# dev server can't quietly grow an unbounded log file on disk.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging
    # Generous ceilings, not a tuned cap — just a backstop against one
    # container eating the whole machine. Hitting these would mean
    # something is actually wrong, not normal dev load.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  backend:
    build: ./backend
    environment:
      # Inside the compose network the DB is reachable as `db`, not
      # `localhost` — that's why this is a separate var from the
      # DATABASE_URL used when running the backend outside Docker.
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8001}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  db_data:
